<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天吃啥">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>今天吃啥 · 餐饮决策工作台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg-1:#1a1310; --bg-2:#241a15; --bg-3:#2e2119;
    --card:#2a1f18; --card-2:#3a2c20;
    --line:rgba(255,255,255,.08);
    --text:#f5ece3; --text-dim:#b8a99a; --text-mute:#7d6e60;
    --accent:#ff6b35; --accent-2:#ff8c5a; --accent-soft:rgba(255,107,53,.16);
    --gold:#f5a623; --green:#6cc24a; --red:#e74c3c;
    --radius:18px;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  html,body{ }
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, #3a2418 0%, transparent 60%),
                radial-gradient(900px 700px at -10% 110%, #2a1810 0%, transparent 55%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text); min-height:100vh; overflow-x:hidden;
    padding:0;
  }
  .wrap{ max-width:860px; margin:0 auto; }

  .header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .logo{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 6px 20px rgba(255,107,53,.4);
  }
  .brand h1{ font-size:22px; font-weight:700; letter-spacing:.5px; }
  .brand .sub{ font-size:12px; color:var(--text-mute); margin-top:2px;}
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .city-sel{
    display:flex; align-items:center; gap:6px; background:var(--bg-3);
    border:1px solid var(--line); border-radius:12px; padding:6px 10px;
  }
  .city-sel .ico{ font-size:14px; }
  .city-sel select{
    background:transparent; border:none; color:var(--text); font-size:13px;
    font-family:inherit; font-weight:700; cursor:pointer; outline:none; max-width:120px;
  }
  .city-sel select option{ background:var(--bg-2); color:var(--text); }
  .city-sel select optgroup{ background:var(--bg-2); color:var(--accent-2); font-weight:700; }
  .meal-tabs{ display:flex; gap:6px; background:var(--bg-3); padding:6px; border-radius:14px; border:1px solid var(--line);}
  .meal-tabs button{
    border:none;background:transparent;color:var(--text-dim);
    padding:9px 20px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;
    transition:.2s; font-family:inherit;
  }
  .meal-tabs button.on{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 4px 14px rgba(255,107,53,.4);}
  .meal-tabs button .ico{ margin-right:5px;}

  .filter{ margin-bottom:18px; }
  .filter-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; cursor:pointer; user-select:none; transition:.15s;
  }
  .filter-bar:hover{ border-color:rgba(255,255,255,.16); }
  .filter-bar .ttl{ font-size:13px; color:var(--text-dim); font-weight:600;}
  .filter-bar .ttl b{ color:var(--accent-2); font-weight:600; }
  .filter-bar .toggle{ font-size:12px; color:var(--text-mute); }
  .cat-pills{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 4px 4px; }
  .cat-pills.hidden{ display:none; }
  .pill{
    padding:6px 14px;border-radius:20px;font-size:13px;background:var(--bg-3);
    color:var(--text-dim);cursor:pointer;border:1px solid var(--line);transition:.15s;
    font-family:inherit;
  }
  .pill:hover{ color:var(--text); }
  .pill.on{ background:var(--accent-soft); color:var(--accent-2); border-color:rgba(255,107,53,.3); }
  .pill .cnt{ font-size:10px; color:var(--text-mute); margin-left:4px; }
  .pill.on .cnt{ color:var(--accent-2); }

  .stage{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:420px; padding:8px 0; }
  .card-wrap{ perspective:1600px; width:340px; height:380px; position:relative; }
  .card{
    width:100%;height:100%;position:relative;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.5,.1,.3,1.15);
  }
  .card.flip{ transform:rotateY(180deg); }
  .face{
    position:absolute;inset:0;border-radius:24px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .face.front{
    background:linear-gradient(165deg,var(--card-2),var(--card));
    border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden;
  }
  .face.front::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(220px 160px at 50% 18%, rgba(255,140,90,.18), transparent 70%);
    pointer-events:none;
  }
  .face.back{ transform:rotateY(180deg); background:linear-gradient(165deg,#3a2c20,#2a1f18); border:1px solid var(--line); }
  .dish-emoji{ font-size:64px; margin-bottom:4px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)); line-height:1; }
  .dish-name{ font-size:28px; font-weight:800; letter-spacing:1px; margin:4px 0 4px; }
  .dish-cat{ font-size:12px; color:var(--accent-2); background:var(--accent-soft); padding:3px 12px; border-radius:20px; display:inline-block; margin-bottom:10px;}
  .dish-desc{ font-size:13px; color:var(--text-dim); line-height:1.6; max-width:240px; margin-bottom:10px;}
  .dish-meta{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .dish-meta span{ font-size:11px; color:var(--text-mute); background:var(--bg-3); padding:3px 9px; border-radius:10px;}
  .shop-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .shop-link{
    font-size:13px; text-decoration:none;
    padding:6px 14px; border-radius:20px; display:inline-flex; align-items:center; gap:4px;
    transition:.15s;
  }
  .shop-link.amap{ color:var(--gold); background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.25); }
  .shop-link.amap:hover{ background:rgba(245,166,35,.18); border-color:rgba(245,166,35,.4); }
  .shop-link.dp{ color:var(--green); background:rgba(108,194,74,.1); border:1px solid rgba(108,194,74,.25); }
  .shop-link.dp:hover{ background:rgba(108,194,74,.18); border-color:rgba(108,194,74,.4); }

  .actions{ display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; justify-content:center;}
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:600; font-size:15px;
    padding:13px 26px; border-radius:14px; transition:.18s; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 6px 20px rgba(255,107,53,.4);}
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 10px 28px rgba(255,107,53,.55);}
  .btn-primary:active{ transform:translateY(0);}
  .btn-ghost{ background:var(--bg-3); color:var(--text-dim); border:1px solid var(--line);}
  .btn-ghost:hover{ color:var(--text); border-color:rgba(255,255,255,.18);}
  .btn-gold{ background:linear-gradient(135deg,var(--gold),#ffb74d); color:#241a15; }
  .btn-gold:hover{ transform:translateY(-2px);}

  .today{ margin-top:26px; }
  .today h3{ font-size:13px; color:var(--text-mute); margin-bottom:10px; font-weight:600;}
  .today-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .today-cell{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 12px;
    text-align:center; transition:.2s; position:relative; cursor:pointer;
  }
  .today-cell .lbl{ font-size:12px; color:var(--text-mute); margin-bottom:5px;}
  .today-cell .nm{ font-size:14px; font-weight:700; min-height:20px;}
  .today-cell .sub-shop{ font-size:11px; color:var(--gold); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .today-cell.empty .nm{ color:var(--text-mute); font-weight:400; font-size:13px;}
  .today-cell.set{ border-color:rgba(255,107,53,.4); background:linear-gradient(160deg,var(--accent-soft),var(--card));}
  .today-cell .clr{ position:absolute; top:6px; right:8px; font-size:13px; color:var(--text-mute); cursor:pointer; opacity:0; transition:.15s;}
  .today-cell.set:hover .clr{ opacity:1;}
  .today-cell .clr:hover{ color:var(--red);}

  .week{ margin-top:26px; }
  .week-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;}
  .week-head h3{ font-size:15px; font-weight:700;}
  .week-head h3 .sub{ font-size:12px; color:var(--text-mute); font-weight:400; margin-left:8px;}
  table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line);}
  th,td{ padding:10px 10px; text-align:center; font-size:12px; border-bottom:1px solid var(--line);}
  th{ background:var(--bg-3); color:var(--text-dim); font-weight:600; font-size:11px;}
  td:first-child{ color:var(--accent-2); font-weight:600; background:rgba(255,255,255,.02);}
  td .em{ font-size:15px; margin-right:3px; vertical-align:middle;}
  td .wk-shop{ font-size:10px; color:var(--green); display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-decoration:none;}
  td .wk-shop:hover{ text-decoration:underline; }
  tr:last-child td{ border-bottom:none;}
  tr:hover td{ background:rgba(255,255,255,.02);}

  /* ===== 随机品牌 · 幸运大转盘 ===== */
  .brand-zone{ margin-top:26px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .brand-zone h3{ font-size:15px; font-weight:700; margin-bottom:4px; }
  .brand-zone h3 .sub{ font-size:12px; color:var(--text-mute); font-weight:400; margin-left:8px; }
  .brand-cats{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px; }
  .brand-cat{
    padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer;
    background:var(--bg-3); color:var(--text-dim); border:1px solid var(--line); transition:.15s; font-family:inherit;
    display:inline-flex; align-items:center; gap:5px;
  }
  .brand-cat:hover{ color:var(--text); }
  .brand-cat.on{ background:var(--accent-soft); color:var(--accent-2); border-color:rgba(255,107,53,.3); }
  .wheel-stage{
    display:flex; flex-direction:column; align-items:center; position:relative;
  }
  .wheel-box{
    position:relative; width:min(340px,92vw); height:min(340px,92vw); max-width:340px; max-height:340px;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.5));
  }
  .wheel-svg{
    width:100%; height:100%; transform:rotate(-90deg); /* 0° starts at top */
    transition:transform 0s;
  }
  .wheel-svg.spinning{ transition:transform 4.5s cubic-bezier(0.15,0,0.1,1); }
  .wheel-sector{ stroke:rgba(0,0,0,.15); stroke-width:1; }
  .wheel-text{
    font-size:12px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:middle;
    text-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none;
  }
  .wheel-pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent;
    border-top:22px solid var(--gold); filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); z-index:3;
  }
  .wheel-center{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:78px; height:78px; border-radius:50%; z-index:4;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    border:4px solid var(--card); box-shadow:0 6px 20px rgba(0,0,0,.4);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:14px; cursor:pointer; user-select:none;
    transition:transform .15s, filter .15s;
  }
  .wheel-center:active{ transform:translate(-50%,-50%) scale(.92); }
  .wheel-center .small{ font-size:10px; font-weight:600; opacity:.9; margin-top:1px; }
  .wheel-center:disabled{ filter:grayscale(.6); cursor:not-allowed; }
  .wheel-result{
    margin-top:18px; min-height:90px; width:100%; text-align:center;
    background:var(--bg-3); border-radius:14px; padding:16px; opacity:0;
    transform:translateY(10px); transition:.35s;
  }
  .wheel-result.show{ opacity:1; transform:translateY(0); }
  .wheel-result .b-emoji{ font-size:38px; line-height:1; }
  .wheel-result .b-name{ font-size:22px; font-weight:800; letter-spacing:.5px; margin-top:6px; }
  .wheel-result .b-tag{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .wheel-result .b-slogan{ font-size:11px; color:var(--text-mute); margin-top:2px; }
  .wheel-hint{ color:var(--text-mute); font-size:13px; text-align:center; padding:28px 0; }
  .brand-links{ display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .wheel-spin-again{
    margin-top:10px; background:transparent; border:1px solid var(--line); color:var(--text-dim);
    padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .wheel-spin-again:hover{ color:var(--text); border-color:rgba(255,255,255,.2); }

  .foot{ text-align:center; color:var(--text-mute); font-size:11px; margin-top:26px; padding:16px; line-height:1.7;}

  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(40px);
    background:var(--card-2); border:1px solid var(--line); color:var(--text);
    padding:12px 22px; border-radius:12px; font-size:14px; opacity:0; transition:.3s; z-index:50;
    box-shadow:var(--shadow);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== App layout: sidebar + main ===== */
  .app{ display:flex; min-height:100vh; }
  .sidebar{
    width:76px; flex-shrink:0; background:var(--bg-1); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:16px 0 12px;
    position:sticky; top:0; height:100vh; z-index:10;
  }
  .sidebar-logo{
    width:44px; height:44px; border-radius:14px; margin-bottom:20px;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 6px 18px rgba(255,107,53,.35);
  }
  .sidebar-nav{ display:flex; flex-direction:column; gap:6px; width:100%; padding:0 6px; }
  .nav-item{
    border:none; background:transparent; color:var(--text-mute); cursor:pointer; font-family:inherit;
    border-radius:12px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; font-weight:600; transition:.15s; width:100%;
  }
  .nav-item .ico{ font-size:20px; }
  .nav-item:hover{ color:var(--text-dim); background:var(--bg-3); }
  .nav-item.on{ background:var(--accent-soft); color:var(--accent-2); }
  .main{ flex:1; min-width:0; }
  .panel{ display:none; padding:20px 24px 60px; }
  .panel.on, section.panel.on{ display:block; }
  .panel-inner{ max-width:860px; margin:0 auto; }

  /* mobile: sidebar becomes bottom bar */
  @media(max-width:768px){
    .app{ display:block; }
    .main{ display:block; width:100%; }
    .sidebar{
      width:100%; height:auto; flex-direction:row; justify-content:space-around;
      position:fixed; bottom:0; left:0; right:0; padding:8px 0 24px;
      padding-bottom:calc(8px + env(safe-area-inset-bottom));
      border-right:none; border-top:1px solid var(--line);
      background:rgba(26,19,16,.96); backdrop-filter:blur(12px); z-index:100;
    }
    .sidebar-logo{ display:none; }
    .sidebar-nav{ flex-direction:row; width:auto; padding:0; }
    .nav-item{ padding:6px 12px; }
    .panel{ padding:16px 16px 100px; }
    .panel.on{ display:block; }
  }

  /* ===== Coin flip panel ===== */
  .coin-presets{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
  .coin-preset{
    background:var(--bg-3); border:1px solid var(--line); color:var(--text-dim); border-radius:20px;
    padding:7px 14px; font-size:13px; cursor:pointer; transition:.15s; white-space:nowrap; font-family:inherit;
  }
  .coin-preset:hover{ border-color:var(--accent); color:var(--text); background:var(--card-2); }
  .coin-input-area{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:20px; }
  .coin-field{ margin-bottom:14px; }
  .coin-field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .coin-field input{
    width:100%; background:var(--bg-3); border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:11px 14px; font-size:15px; font-family:inherit;
  }
  .coin-field input:focus{ outline:none; border-color:var(--accent); }
  .coin-options-row{ display:flex; gap:12px; }
  .coin-options-row .coin-field{ flex:1; margin-bottom:0; }
  .coin-stage{ perspective:800px; display:flex; justify-content:center; align-items:center; height:200px; margin-bottom:16px; position:relative; }
  .coin-3d{ width:150px; height:150px; position:relative; transform-style:preserve-3d; transition:transform 1.8s cubic-bezier(.22,.61,.36,1); }
  .coin-3d.flipping{ animation:coinShake .12s ease-in-out 3; }
  @keyframes coinShake{ 0%,100%{ margin-top:0 } 50%{ margin-top:-6px } }
  .coin-face{ position:absolute; inset:0; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; backface-visibility:hidden; font-size:26px; font-weight:700; gap:4px; }
  .coin-front{ background:linear-gradient(135deg,#ffd43b,#ffa500); color:#1a1a00; box-shadow:0 4px 30px rgba(255,212,59,.2),inset 0 2px 8px rgba(255,255,255,.3),inset 0 -2px 8px rgba(0,0,0,.1); }
  .coin-back{ background:linear-gradient(135deg,#748ffc,#5c7cfa); color:#fff; transform:rotateY(180deg); box-shadow:0 4px 30px rgba(116,143,252,.2),inset 0 2px 8px rgba(255,255,255,.15),inset 0 -2px 8px rgba(0,0,0,.2); }
  .coin-face .emoji{ font-size:40px; margin-bottom:2px; }
  .coin-face .label{ font-size:22px; }
  .coin-result{ text-align:center; min-height:60px; margin-bottom:20px; transition:.3s; }
  .coin-result .verdict{ font-size:32px; font-weight:800; letter-spacing:1px; }
  .coin-result .comment{ font-size:13px; color:var(--text-mute); margin-top:8px; }
  .verdict.yes{ color:var(--gold); text-shadow:0 0 20px rgba(255,212,59,.3); }
  .verdict.no{ color:#748ffc; text-shadow:0 0 20px rgba(116,143,252,.3); }
  .btn-flip{
    width:100%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border:none;
    border-radius:14px; padding:16px; font-size:18px; font-weight:700; cursor:pointer; transition:.15s;
    letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit;
  }
  .btn-flip:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .btn-flip:active{ transform:translateY(0); }
  .btn-flip:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .coin-history{ margin-top:24px; }
  .coin-history h3{ font-size:13px; color:var(--text-dim); margin-bottom:10px; font-weight:600; }
  .coin-history-list{ display:flex; flex-direction:column; gap:8px; }
  .coin-history-item{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .coin-history-item .q{ color:var(--text-dim); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .coin-history-item .a{ font-weight:700; font-size:14px; white-space:nowrap; }
  .coin-history-item .a.yes{ color:var(--gold); } .coin-history-item .a.no{ color:#748ffc; }
  .coin-reset-link{ text-align:center; margin-top:12px; }
  .coin-reset-link a{ color:var(--text-mute); font-size:13px; cursor:pointer; text-decoration:none; }
  .coin-reset-link a:hover{ color:var(--text-dim); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">🍜</div>
    <nav class="sidebar-nav">
      <button class="nav-item on" data-tab="food" onclick="switchTab('food')"><span class="ico">🍜</span><span>吃什么</span></button>

let state = { meal:"早", cat:"全部", city:"上海", current:null, today:{早:null,午:null,晚:null} };
const MEAL_LABEL = {早:"早餐",午:"午餐",晚:"晚餐"};

/* 大众点评城市ID（华东华北等36城） */
const DP_CITY = {上海:1,北京:2,杭州:3,广州:4,南京:5,天津:6,深圳:7,成都:8,重庆:9,青岛:10,沈阳:11,苏州:12,西安:13,武汉:14,长沙:15,大连:16,宁波:17,济南:18,哈尔滨:19,无锡:20,厦门:21,福州:22,长春:23,郑州:24,昆明:25,合肥:26,南昌:27,太原:28,南宁:29,石家庄:30,贵阳:31,兰州:32,东莞:33,佛山:34,海口:35};

function searchQuery(d){
  if(state.city==="上海" || d.scope==="national") return d.shop;
  return d.n;
}
function displayShop(d){
  if(state.city==="上海" || d.scope==="national") return d.shop;
  return `找附近"${d.n}"`;
}
function mapLink(q){
  return `https://www.amap.com/search?query=${encodeURIComponent(q)}&city=${encodeURIComponent(state.city)}`;
}
function dpLink(d){
  const id = DP_CITY[state.city] || 1;
  return `https://www.dianping.com/search/keyword/${id}/0_${encodeURIComponent(searchQuery(d))}`;
}

function dishesForContext(){
  let list = DISHES.slice();
  if(state.cat!=="全部") list = list.filter(d=>d.c===state.cat);
  if(state.meal==="早"){
    list = list.filter(d=>d.c==="早餐");
    if(list.length===0) list = DISHES.filter(d=>d.c==="早餐");
  }else{
    list = list.filter(d=>d.c!=="早餐");
    if(list.length===0) list = DISHES.filter(d=>d.c!=="早餐");
  }
  return list;
}

document.getElementById("cityPicker").onchange = e=>{
  state.city = e.target.value;
  toast(`📍 已切换到 ${state.city}`);
  refreshAll();
};
function refreshAll(){
  document.getElementById("curCat").textContent = state.cat;
  if(state.current) renderCard(state.current); else resetCard();
  renderToday();
  if(document.getElementById("weekBox").style.display!=="none") genWeek();
}

let filterOpen = true;
function renderCats(){
  const counts = {"全部":DISHES.length};
  DISHES.forEach(d=>counts[d.c]=(counts[d.c]||0)+1);
  const order = ["早餐","川菜","粤菜","湘菜","东北","江浙","家常","面食","火锅","烤肉","西餐","日料","快餐","烧烤","东南亚","韩餐","小吃","甜品","轻食","海鲜","新疆","云南","闽台"];
  const cats = ["全部",...order.filter(c=>counts[c])];
  document.getElementById("catPills").innerHTML = cats.map(c=>
    `<button class="pill ${c===state.cat?'on':''}" data-cat="${c}">${c}<span class="cnt">${counts[c]}</span></button>`
  ).join("");
  document.getElementById("catPills").querySelectorAll(".pill").forEach(el=>{
    el.onclick=()=>{ state.cat=el.dataset.cat; renderCats(); resetCard(); };
  });
  document.getElementById("curCat").textContent=state.cat;
}
document.getElementById("filterBar").onclick=()=>{
  filterOpen=!filterOpen;
  document.getElementById("catPills").classList.toggle("hidden",!filterOpen);
  document.getElementById("filterToggle").innerHTML = filterOpen?"收起 ▴":"展开 ▾";
};

document.getElementById("mealTabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  state.meal=b.dataset.meal;
  document.querySelectorAll("#mealTabs button").forEach(x=>x.classList.toggle("on",x===b));
  resetCard();
  renderToday();
});

function pick(){
  const pool = dishesForContext();
  if(pool.length===0) return null;
  let tries=0, d;
  do{ d=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  while(state.current && d.n===state.current.n && tries<8 && pool.length>1);
  return d;
}
function renderCard(d){
  if(!d){
    document.getElementById("cardFront").innerHTML = `
      <div class="dish-emoji">🤔</div>
      <div class="dish-name">暂无菜品</div>
      <div class="dish-desc">当前筛选下没有菜<br>换一个菜系试试</div>`;
    return;
  }
  const shopHtml = d.shop ? `
    <div class="shop-actions">
      <a class="shop-link amap" href="${mapLink(searchQuery(d))}" target="_blank" rel="noopener">📍 ${displayShop(d)} ↗</a>
      <a class="shop-link dp" href="${dpLink(d)}" target="_blank" rel="noopener">🍱 点评/外卖 ↗</a>
    </div>` : "";
  document.getElementById("cardBack").innerHTML = `
    <div class="dish-emoji">${d.e}</div>
    <div class="dish-name">${d.n}</div>
    <div class="dish-cat">${d.c} · ${MEAL_LABEL[state.meal]}</div>
    <div class="dish-desc">${d.desc||""}</div>
    <div class="dish-meta"><span>${d.cal||""}</span></div>
    ${shopHtml}`;
}
function resetCard(){
  state.current=null;
  document.getElementById("cardFront").innerHTML = `
    <div class="dish-emoji">🍽️</div>
    <div class="dish-name">点"换一个"</div>
    <div class="dish-desc">从${state.cat==="全部"?"全部菜系":state.cat}里随机抽一道<br>${MEAL_LABEL[state.meal]}时段 · ${state.city}</div>`;
}
function flipRoll(d){
  const card=document.getElementById("card");
  renderCard(d);
  card.classList.remove("flip");
  void card.offsetWidth;
  card.classList.add("flip");
}
document.getElementById("rollBtn").onclick=()=>{
  const d=pick();
  if(!d){ toast("当前没有可选的菜,换换筛选"); return; }
  state.current=d; flipRoll(d);
};
document.getElementById("lockBtn").onclick=()=>{
  if(!state.current){ toast('先点"换一个"抽一道菜'); return; }
  state.today[state.meal]=state.current;
  renderToday();
  toast(`✅ ${MEAL_LABEL[state.meal]}已定：${state.current.n}`);
};

function renderToday(){
  const box=document.getElementById("todayGrid");
  box.innerHTML=["早","午","晚"].map(m=>{
    const d=state.today[m]; const set=!!d;
    const shopTxt = (set&&d.shop) ? displayShop(d) : "";
    return `<div class="today-cell ${set?'set':'empty'}" data-meal="${m}">
      <div class="lbl">${MEAL_LABEL[m]}</div>
      <div class="nm">${set?`${d.e} ${d.n}`:"未定"}</div>
      ${shopTxt?`<div class="sub-shop" title="${shopTxt}">📍 ${shopTxt}</div>`:""}
      ${set?`<span class="clr" data-meal="${m}">✕</span>`:""}
    </div>`;
  }).join("");
  box.querySelectorAll(".clr").forEach(x=>x.onclick=ev=>{ ev.stopPropagation(); state.today[x.dataset.meal]=null; renderToday(); });
  box.querySelectorAll(".today-cell").forEach(c=>{ c.onclick=()=>{
    state.meal=c.dataset.meal;
    document.querySelectorAll("#mealTabs button").forEach(b=>b.classList.toggle("on",b.dataset.meal===state.meal));
    resetCard();
  };});
}

const WEEK_DAYS=["周一","周二","周三","周四","周五","周六","周日"];
function pickFromCat(c){ const p=DISHES.filter(d=>d.c===c); return p[Math.floor(Math.random()*p.length)]; }
function pickFromNonBreakfast(){ const p=DISHES.filter(d=>d.c!=="早餐"); return p[Math.floor(Math.random()*p.length)]; }
function genWeek(){
  let html="<thead><tr><th>日期</th><th>🌅 早餐</th><th>☀️ 午餐</th><th>🌙 晚餐</th></tr></thead><tbody>";
  WEEK_DAYS.forEach(day=>{
    const b=pickFromCat("早餐"), l=pickFromNonBreakfast(), d=pickFromNonBreakfast();
    const cell = x => `<span class="em">${x.e}</span>${x.n}<a class="wk-shop" href="${dpLink(x)}" target="_blank" rel="noopener" title="去大众点评">🍱 ${displayShop(x)}</a>`;
    html+=`<tr><td>${day}</td><td>${cell(b)}</td><td>${cell(l)}</td><td>${cell(d)}</td></tr>`;
  });
  html+="</tbody>";
  document.getElementById("weekTable").innerHTML=html;
  document.getElementById("weekBox").style.display="block";
}
document.getElementById("weekBtn").onclick=genWeek;
document.getElementById("reWeekBtn").onclick=genWeek;

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

let brandCat = null;
let brandCurrent = null;
let wheelAngle = -90;
let wheelSpinning = false;

function renderBrandCats(){
  const keys = Object.keys(BRANDS);
  document.getElementById("brandCats").innerHTML = keys.map(k=>{
    const b = BRANDS[k];
    return `<button class="brand-cat ${k===brandCat?'on':''}" data-cat="${k}">${b.emoji} ${k}</button>`;
  }).join("");
  document.getElementById("brandCats").querySelectorAll(".brand-cat").forEach(el=>{
    el.onclick=()=>{
      brandCat = el.dataset.cat;
      brandCurrent = null;
      renderBrandCats();
      renderWheel();
    };
  });
}

function renderWheel(){
  const hint = document.getElementById("wheelHint");
  const box = document.getElementById("wheelBox");
  const result = document.getElementById("wheelResult");
  if(!brandCat){
    hint.style.display="block"; box.style.display="none"; result.classList.remove("show");
    return;
  }
  hint.style.display="none"; box.style.display="block"; result.classList.remove("show");

  const items = BRANDS[brandCat].items;
  const n = items.length;
  const sector = 360 / n;
  const r = 180;
  const cx = 200, cy = 200;
  let svg = '';

  items.forEach((b,i)=>{
    const start = i * sector;
    const end = start + sector;
    const rad1 = start * Math.PI / 180;
    const rad2 = end * Math.PI / 180;
    const x1 = cx + r * Math.cos(rad1);
    const y1 = cy + r * Math.sin(rad1);
    const x2 = cx + r * Math.cos(rad2);
    const y2 = cy + r * Math.sin(rad2);
    const largeArc = sector > 180 ? 1 : 0;

    // hue spread across warm palette, skipping muddy browns
    const hue = (i / n) * 360;
    const color = `hsl(${hue} 78% ${i%2===0?52:46}%)`;

    // label position and rotation
    const mid = start + sector/2;
    const midRad = mid * Math.PI / 180;
    const labelR = n > 16 ? 118 : (n > 10 ? 128 : 138);
    const lx = cx + labelR * Math.cos(midRad);
    const ly = cy + labelR * Math.sin(midRad);
    // keep text readable: rotate so it points outward from center
    const textRot = mid;
    const shortName = b.n.length > 4 ? b.n.slice(0,3) + (b.n.length>3?'…':'') : b.n;
    const fontSize = n > 18 ? 9 : (n > 12 ? 10 : 12);

    svg += `<path class="wheel-sector" d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${color}"></path>`;
    svg += `<text class="wheel-text" x="${lx}" y="${ly}" transform="rotate(${textRot} ${lx} ${ly})" font-size="${fontSize}">${shortName}</text>`;
  });

  document.getElementById("wheelSvg").innerHTML = svg;
  wheelAngle = -90;
  document.getElementById("wheelSvg").style.transform = `rotate(${wheelAngle}deg)`;
  document.getElementById("wheelSvg").classList.remove("spinning");
}

function spinWheel(){
  if(wheelSpinning || !brandCat) return;
  const items = BRANDS[brandCat].items;
  if(items.length === 0) return;

  wheelSpinning = true;
  document.getElementById("wheelStart").disabled = true;
  document.getElementById("wheelResult").classList.remove("show");

  // pick winner
  const idx = Math.floor(Math.random() * items.length);
  const n = items.length;
  const sector = 360 / n;
  const targetMid = idx * sector + sector/2;

  // spin at least 5 rounds, land on target
  const rounds = 5 + Math.floor(Math.random() * 3);
  // Correct alignment: SVG rotate(X) puts math-angle A at visual position A+X.
  // Pointer is at top (-90deg). We need: targetMid + X = -90 (mod 360).
  // So target X = -90 - targetMid. Compute delta from current position.
  const targetMod = ((-90 - targetMid) % 360 + 360) % 360;
  const currentMod = ((wheelAngle % 360) + 360) % 360;
  let delta = targetMod - currentMod;
  if(delta < 0) delta += 360;
  wheelAngle = wheelAngle + 360 * rounds + delta;

  const svg = document.getElementById("wheelSvg");
  svg.classList.add("spinning");
  // force reflow
  void svg.offsetWidth;
  svg.style.transform = `rotate(${wheelAngle}deg)`;

  setTimeout(()=>{
    wheelSpinning = false;
    document.getElementById("wheelStart").disabled = false;
    brandCurrent = items[idx];
    showBrandResult(brandCurrent);
  }, 4600);
}

function showBrandResult(b){
  const emoji = BRANDS[brandCat].emoji;
  document.getElementById("wrEmoji").textContent = emoji;
  document.getElementById("wrName").textContent = b.n;
  document.getElementById("wrTag").textContent = b.t;
  document.getElementById("wrSlogan").textContent = `「${b.s}」`;

  const linksEl = document.getElementById("brandLinks");
  const query = encodeURIComponent(b.n);
  linksEl.innerHTML = `
    <a class="shop-link amap" href="https://www.amap.com/search?query=${query}&city=${encodeURIComponent(state.city)}" target="_blank" rel="noopener">📍 附近搜索 ↗</a>
    <a class="shop-link dp" href="https://www.dianping.com/search/keyword/${DP_CITY[state.city]||1}/0_${query}" target="_blank" rel="noopener">🍱 点评/外卖 ↗</a>
  `;

  document.getElementById("wheelResult").classList.add("show");
}


/* ============ Tab Switching ============ */
function switchTab(tab){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('on', el.dataset.tab===tab);
  });
  document.querySelectorAll('.panel').forEach(el=>{
    el.classList.toggle('on', el.id==='panel-'+tab);
  });
  // re-render wheel when switching to brand tab
  if(tab==='brand' && brandCat) renderWheel();
  // scroll to top
  window.scrollTo(0,0);
}

const COIN_PRESETS=[
  {q:"今天喝咖啡？",a:"喝",b:"不喝",emoji:"☕"},
  {q:"喝奶茶吗？",a:"喝",b:"不喝",emoji:"🧋"},

  {q:"要不要发消息？",a:"发",b:"不发",emoji:"💬"},
  {q:"今天出门吗？",a:"出",b:"不出",emoji:"🚪"},
];
const COIN_COMMENTS={
  yes:["命运说你该 ✊","天意如此，别纠结了","硬币都说了，干就完了","宇宙站你这边","今天的运气在这了","命运安排好了，去吧"],
  no:["命运劝你冷静 🙅","天意说：算了","硬币说不，听话","今天的运势：克制","命运替你省了一笔","宇宙说：今天不行"]
};
let coinFlipping=false;
let coinRotation=0;
let coinHistory=[];
try{const h=localStorage.getItem("pp_decisions");if(h)coinHistory=JSON.parse(h);}catch(e){}

function initCoin(){
  const pc=document.getElementById("coinPresets");
  pc.innerHTML=COIN_PRESETS.map(p=>`<div class="coin-preset" onclick="applyCoinPreset('${p.q}','${p.a}','${p.b}')">${p.emoji} ${p.q}</div>`).join("");
  updateCoinLabels();
  renderCoinHistory();
}
function applyCoinPreset(q,a,b){
  document.getElementById("coinQuestion").value=q;
  document.getElementById("coinOptA").value=a;
  document.getElementById("coinOptB").value=b;
  updateCoinLabels();
}
function updateCoinLabels(){
  const a=document.getElementById("coinOptA").value||"A";
  const b=document.getElementById("coinOptB").value||"B";
  document.getElementById("coinLabelA").textContent=a;
  document.getElementById("coinLabelB").textContent=b;
}
document.addEventListener("input",function(e){
  if(e.target.id==="coinOptA"||e.target.id==="coinOptB") updateCoinLabels();
});
function flipCoin(){
  if(coinFlipping)return;
  const q=document.getElementById("coinQuestion").value.trim();
  if(!q){toast("先写个问题呀");return;}
  const a=document.getElementById("coinOptA").value.trim()||"A";
  const b=document.getElementById("coinOptB").value.trim()||"B";
  coinFlipping=true;
  const btn=document.getElementById("flipBtn");
  btn.disabled=true;
  const coin=document.getElementById("coin");
  coin.classList.add("flipping");
  const pick=Math.random()<0.5?0:1;
  const spins=5+Math.floor(Math.random()*3);
  const targetOffset=pick===0?0:180;
  coinRotation+=spins*360+((targetOffset-(coinRotation%360))+360)%360;
  coin.style.transform=`rotateY(${coinRotation}deg)`;
  document.getElementById("coinResult").innerHTML='<div class="comment" style="font-size:18px">🪙 硬币飞起来了...</div>';
  setTimeout(()=>{
    coin.classList.remove("flipping");
    const result=document.getElementById("coinResult");
    const isYes=pick===0;
    const comment=COIN_COMMENTS[isYes?"yes":"no"][Math.floor(Math.random()*6)];
    result.innerHTML=`<div class="verdict ${isYes?"yes":"no"}">${isYes?a:b}</div><div class="comment">${comment}</div>`;
    coinHistory.unshift({q,a,b,answer:isYes?a:b,isYes,time:new Date().toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})});
    if(coinHistory.length>20)coinHistory=coinHistory.slice(0,20);
    try{localStorage.setItem("pp_decisions",JSON.stringify(coinHistory));}catch(e){}
    renderCoinHistory();
    coinFlipping=false;
    btn.disabled=false;
    btn.textContent="🪙 再来一次";
  },1800);
}
function renderCoinHistory(){
  const sec=document.getElementById("coinHistorySection");
  const list=document.getElementById("coinHistoryList");
  if(!coinHistory.length){sec.style.display="none";return;}
  sec.style.display="block";
  list.innerHTML=coinHistory.map(h=>`<div class="coin-history-item"><span class="q">${h.q} → <b style="color:var(--text)">${h.answer}</b></span><span class="a ${h.isYes?"yes":"no"}" style="font-size:11px">${h.time}</span></div>`).join("");
}
function clearCoinHistory(){
  if(!coinHistory.length)return;
  if(!confirm("清空所有决定记录？"))return;
  coinHistory=[];try{localStorage.removeItem("pp_decisions");}catch(e){}
  renderCoinHistory();toast("已清空");
}
